<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gameLayout">
    <section class="options">
      <h2 class="center">Game Options</h2>
      <h3>Difficulty</h3>
      <select id="difficulty" class="difficultyInput">
        <option value="Easy">Easy</option>
        <option value="Normal" selected>Normal</option>
        <option value="Hard">Hard</option>
      </select>
      <h3>Seeds</h3>
      <input type="number" id="seed" class="seedInput" placeholder="Enter seed (optional)">
      <button id="randomize" class="randBtn">
        Randomize Seed
      </button>
      <button id="startButton" class="startBtn">
        Start Seed
      </button>
      <div class="dotsOptions">
        <h3>Dots</h3>
        <p>Player Color:</p>
        <input type="color" id="playerColor" class="colorInput" value="#3232FF">
        <p>Player Shape:</p>
        <select id="playerShape" class="shapeInput">
          <option value="dot">Dot</option>
          <option value="pure_dot">Pure Dot</option>
          <option value="square">Square</option>
          <option value="triangle">Triangle</option>
          <option value="diamond">Diamond</option>
          <option value="heart">Heart</option>
          <option value="star">Star</option>
          <option value="block">Block</option>
        </select>
        <p>Enemy Color:</p>
        <input type="color" id="enemyColor" class="colorInput" value="#FF3232">
        <p>Enemy Shape:</p>
        <select id="enemyShape" class="shapeInput">
          <option value="dot">Dot</option>
          <option value="pure_dot">Pure Dot</option>
          <option value="square">Square</option>
          <option value="triangle">Triangle</option>
          <option value="diamond">Diamond</option>
          <option value="heart">Heart</option>
          <option value="star">Star</option>
          <option value="block">Block</option>
        </select>
      </div>
    </section>
    <section class="game">
      <h3 class="center" id="hint">
        Use ARROWS or WASD keys to move
      </h3>
      <div class="grid">
        <div class="dots" id="dots"></div>
      </div>
      <h3 id="message" class="center">
        Moves: 0
      </h3>
      <h3 id="highscore" class="center">High Scores:</h3>
      <ul class="scoreList">
        <li id="easyScore">Easy: 0</li>
        <li id="normalScore">Normal: 0</li>
        <li id="hardScore">Hard: 0</li>
      </ul>
    </section>
  </main>
  <footer>
    <p class="footer">&copy; 2026 Swarm. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
